# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem)
# proposes updates.
# The whole release is this one workflow, in one ordered path, so a release can only become public after everything
# before it has succeeded. A v* tag can never be moved or deleted, so nothing here is optimistic.
#   build    (contents: read)  the tag, every package version, the changelog and the tagged commit must agree
#                              (scripts/check-release-version.py); build the cloud-crawler-core wheel and sdist; verify
#                              the wheel carries the detector registry, no cloud SDK import and no Azure endpoint; write
#                              a CycloneDX SBOM (the engine's locked runtime dependencies) and the release notes; keep
#                              all of it, with a sha256 list, as one workflow artifact.
#   attest   (id-token and attestations: write, no repository write)  attest provenance and the SBOM for the wheel and
#                              the sdist, then verify the attestations (this workflow file, this ref, this commit).
#   release  (contents: write; a tag only)  verify the attestations again against the downloaded files, create the
#                              GitHub Release as a DRAFT with the wheel, sdist and SBOM, check that it holds exactly
#                              those three files, and only then make it public (scripts/release-publish.py).
#   pypi     (id-token: write; a tag only, and only when the repository variable PYPI_ENABLED == 'true')
#                              `uv publish --trusted-publishing always` exchanges the job's OIDC token with PyPI; no
#                              registry token exists anywhere.
# The AddOn (HCW-CloudCrawler_AddOn, ADR 0001 there; ADR 0002 here) pins the wheel this release attaches, by URL on its
# CORE_REF line
# (https://github.com/saulpatinojr/HCW-CloudCrawler_App/releases/download/v0.1.0/cloud_crawler_core-0.1.0-py3-none-any.whl)
# and by the sha256 `uv lock` records; its core-update.yml bumps the tag. A git+https pin cannot be verified by the
# AddOn image's `pip install --require-hashes`, which is why the asset, not the tag, is the contract.
# Dry run: Actions, publish-core, Run workflow, on the main branch only (any other ref fails at once). It takes the tag
# to be v + the package version and runs the SAME checks as a real tag (tag format, a dated non-empty changelog section,
# nothing under Unreleased, the tag not yet used, the commit on main, the built files), builds, and keeps the files as a
# workflow artifact. It publishes nothing: the release and PyPI jobs run only for a pushed v* tag, so a manual run can
# never publish, whatever ref it names. "attest" is off by default because attestations are permanent entries in the
# public signing log; tick it once to rehearse them too (they are then verified with the same strict flags, naming the
# branch instead of the tag).
# Re-running: "Re-run failed jobs" on a tag run uses THIS FILE AS IT IS AT THE TAGGED COMMIT and the files built by
# that run, so a fix merged to main later cannot reach it. A release that already exists (draft or public) for the tag
# is never touched and no file is ever replaced: the job stops and says what to delete by hand.
name: publish-core
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      attest:
        description: "Dry run only: also create and verify the attestations (permanent public signing log entries)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-core-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: A manual run is only allowed on main
        if: github.event_name != 'push' && github.ref != 'refs/heads/main'
        env: { REF: "${{ github.ref }}" }
        run: |
          echo "::error::the dry run runs on the main branch only (this run is on $REF): Run workflow, Branch: main"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.14" }
      - run: python -m pip install "uv==0.11.32"
      - name: The tag, the versions and the changelog agree (a dry run runs the same checks as the tag), and the notes
        env: { EVENT_NAME: "${{ github.event_name }}", REF_NAME: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then mode=(--tag "$REF_NAME"); else mode=(--rehearse); fi
          python scripts/check-release-version.py "${mode[@]}" --ancestor-of origin/main --notes-out release-notes.md
          {
            echo "### Release notes that this run would publish"; echo; cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - run: uv build --no-create-gitignore --package cloud-crawler-core --out-dir dist
      - name: Only the wheel and the sdist for this version were built, and the wheel's own version agrees
        env: { EVENT_NAME: "${{ github.event_name }}", REF_NAME: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then mode=(--tag "$REF_NAME"); else mode=(--rehearse); fi
          python scripts/check-release-version.py "${mode[@]}" --dist dist
      - name: The wheel carries the engine, no cloud SDK import, no HTTP client and no Azure endpoint
        run: python -I scripts/verify-core-wheel.py 'dist/cloud_crawler_core-*.whl'
      - name: SBOM (CycloneDX) of the engine's locked runtime dependencies
        run: |
          set -euo pipefail
          mkdir sbom
          uv export --frozen --quiet --package cloud-crawler-core --no-dev --format cyclonedx1.5 \
            -o sbom/cloud-crawler-core.cdx.json
          test -s sbom/cloud-crawler-core.cdx.json
      - name: sha256 of every file (the AddOn's uv.lock records the wheel's; the later jobs check the list)
        run: |
          set -euo pipefail
          sha256sum dist/* sbom/* | tee SHA256SUMS
          { echo '### sha256'; echo; echo '```text'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-crawler-core-release-files
          path: |
            dist
            sbom
            release-notes.md
            SHA256SUMS
          if-no-files-found: error
  attest:
    needs: build
    if: github.event_name == 'push' || inputs.attest
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # to get the signing certificate for the attestations
      attestations: write # to store them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.14" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: cloud-crawler-core-release-files, path: release-files }
      - name: The files are the ones that were built
        working-directory: release-files
        run: sha256sum --check --strict SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-path: "release-files/dist/*" }
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "release-files/dist/*"
          sbom-path: "release-files/sbom/cloud-crawler-core.cdx.json"
      - name: Verify the attestations (provenance, then SBOM) came from this workflow, this ref and this commit
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          WORKFLOW_FILE: ".github/workflows/publish-core.yml"
          SOURCE_REF: "${{ github.ref }}"
          SOURCE_DIGEST: "${{ github.sha }}"
        run: |
          python -I scripts/release-publish.py verify-attestations --dir release-files/dist --repo "$GH_REPO" \
            --workflow "$WORKFLOW_FILE" --source-ref "$SOURCE_REF" --source-digest "$SOURCE_DIGEST"
  release:
    needs: [build, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write # to create and publish the release
      attestations: read # to verify them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.14" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: cloud-crawler-core-release-files, path: release-files }
      - name: The files are the ones that were built
        working-directory: release-files
        run: sha256sum --check --strict SHA256SUMS
      - name: Verify the attestations of the downloaded files (this workflow, this tag, this commit)
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          WORKFLOW_FILE: ".github/workflows/publish-core.yml"
          SOURCE_REF: "${{ github.ref }}"
          SOURCE_DIGEST: "${{ github.sha }}"
        run: |
          python -I scripts/release-publish.py verify-attestations --dir release-files/dist --repo "$GH_REPO" \
            --workflow "$WORKFLOW_FILE" --source-ref "$SOURCE_REF" --source-digest "$SOURCE_DIGEST"
      - name: Create the release as a draft, check it holds exactly the three files, then make it public
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", TAG: "${{ github.ref_name }}" }
        run: python -I scripts/release-publish.py publish --repo "$GH_REPO" --tag "$TAG" --dir release-files
  pypi:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.14" }
      - run: python -m pip install "uv==0.11.32"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: cloud-crawler-core-release-files, path: release-files }
      - name: The files are the ones that were built and attested
        working-directory: release-files
        run: sha256sum --check --strict SHA256SUMS
      - name: PyPI trusted publishing (repository variable PYPI_ENABLED)
        run: uv publish --trusted-publishing always release-files/dist/*
