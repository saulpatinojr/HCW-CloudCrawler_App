# Keeps requirements.lock.txt in step with uv.lock on Dependabot's own Python pull requests.
#
# Why: Dependabot's uv support edits pyproject.toml and uv.lock but cannot produce the hash-pinned export the image
# installs, so every one of its Python pull requests failed `lint` (scripts/check-lockfiles.sh) until someone ran
# `make lock` by hand. .github/dependabot.yml also stops it editing the export directly (exclude-paths), which it did
# wrongly: it once moved a version in the export alone, leaving uv.lock behind.
#
# What it does, only on a pull request Dependabot opened whose newest commit is Dependabot's:
#   1. checks out the pull request branch without storing a credential,
#   2. regenerates the export with scripts/export-lockfiles.sh (uv export --frozen: reads uv.lock only; nothing is
#      resolved, downloaded or built, so no dependency code runs),
#   3. if the export changed, commits it and pushes it with a short-lived token of the HCW Main Admin GitHub App
#      (ADR 0006; the App the add-ons' core-update.yml opens its pull requests with). The push must not use
#      GITHUB_TOKEN: a push made with it starts no workflow, and checks from a workflow_dispatch run do not count as a
#      pull request's required checks
#      (https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#checks-from-some-workflow-jobs-are-not-evaluated).
#      A push made with the App's token is an ordinary push, so `ci` and `security` run on the new commit as usual.
# The App's id and key are Dependabot secrets (HCW_MAIN_ADMIN_CLIENT_ID, HCW_MAIN_ADMIN_PRIVATE_KEY), because a workflow
# Dependabot starts can read only those. Until the owner adds them the job stops with an error that says so.
# Anything else (a stale uv.lock, a failing test) is still caught by ci on the new commit and needs a person.
name: dependabot-lockfiles
on:
  pull_request:
    paths: ["pyproject.toml", "uv.lock", "packages/*/pyproject.toml"]
permissions:
  contents: read
concurrency:
  group: dependabot-lockfiles-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.14"
jobs:
  export:
    # Dependabot opened it and the branch is a Dependabot uv branch in this repository. The pull request's author is
    # used, not github.actor, which a re-run can change (zizmor bot-conditions). Whether Dependabot made the latest
    # push is checked on the commit itself in the first steps; the App's own push therefore stops there.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/uv/')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the push uses the App's token, never this one
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: The branch is still at this event's commit, and Dependabot wrote that commit
        id: head
        env: { EXPECTED: "${{ github.event.pull_request.head.sha }}" }
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED" # a newer push gets its own run
          author="$(git log -1 --format=%ae)"
          if [ "$author" = "49699333+dependabot[bot]@users.noreply.github.com" ]; then
            echo "dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "The newest commit is not Dependabot's ($author), so this branch is left alone." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.head.outputs.dependabot == 'true'
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install uv
        if: steps.head.outputs.dependabot == 'true'
        run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - name: Regenerate the export from uv.lock
        if: steps.head.outputs.dependabot == 'true'
        id: export
        run: |
          set -euo pipefail
          bash scripts/export-lockfiles.sh
          if git diff --quiet -- requirements.lock.txt; then
            echo "requirements.lock.txt already matches uv.lock; nothing to push" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The HCW Main Admin App is set up
        if: steps.export.outputs.changed == 'true'
        env:
          HAS_ID: ${{ secrets.HCW_MAIN_ADMIN_CLIENT_ID != '' }}
          HAS_KEY: ${{ secrets.HCW_MAIN_ADMIN_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_ID" != "true" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::The Dependabot secrets HCW_MAIN_ADMIN_CLIENT_ID and HCW_MAIN_ADMIN_PRIVATE_KEY are not set, so the regenerated requirements.lock.txt cannot be pushed in a way that runs the required checks. Set them up (ADR 0006, Validation), or run 'make lock' on this branch and push."
            exit 1
          fi
      - name: Get a short-lived token of the HCW Main Admin App, for this repository only, contents only
        if: steps.export.outputs.changed == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # no owner and no repositories input: the token covers this repository only (the App is on several)
          client-id: ${{ secrets.HCW_MAIN_ADMIN_CLIENT_ID }}
          private-key: ${{ secrets.HCW_MAIN_ADMIN_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit the export and push it to the Dependabot branch
        if: steps.export.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock.txt
          git commit -m "Regenerate requirements.lock.txt from uv.lock (make lock)"
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$BRANCH"
          echo "Pushed $(git rev-parse --short HEAD) to $BRANCH; ci and security run on it as on any push." \
            | tee -a "$GITHUB_STEP_SUMMARY"
