# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem)
# proposes updates.
# Creates the GitHub Release for a v* tag from the matching CHANGELOG.md section (publish-core.yml attaches the
# engine wheel, sdist and SBOM to it). Uses gh with GITHUB_TOKEN; no third-party action.
# Two jobs, so the write permission exists only where a release is really created:
#   check   (contents: read)  the tag, every package version, the changelog and the tagged commit must agree
#                             (scripts/check-release-version.py; a v* tag can never be moved or deleted, so this is
#                             the last chance to stop a wrong one), then the release notes are written.
#   create  (contents: write) only for a v* tag: creates the release with the notes; one that exists is left alone.
# Dry run: Actions, release, Run workflow, on the main branch. It runs `check` only (no tag, so `create` is skipped),
# prints the release notes a tag would publish in the run summary and keeps them as a workflow artifact. Only a pushed
# v* tag creates a release, so a manual run can never create one, whatever ref it names.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.14" }
      - name: The tag, the versions and the changelog agree, and the notes are written
        env: { REF_TYPE: "${{ github.ref_type }}", REF_NAME: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            python scripts/check-release-version.py --tag "$REF_NAME" --ancestor-of origin/main \
              --notes-out release-notes.md
          else
            echo "::notice::dry run: no tag, so the checks that need one are skipped"
            python scripts/check-release-version.py --notes-out release-notes.md
          fi
          { echo "### Release notes that a tag would publish"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: release-notes, path: release-notes.md, if-no-files-found: error }
  create:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.14" }
      - name: Release notes from CHANGELOG.md
        env: { REF_NAME: "${{ github.ref_name }}" }
        run: python scripts/check-release-version.py --tag "$REF_NAME" --notes-out release-notes.md
      - name: Create the release (a release that already exists is left alone)
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", TAG: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          if found="$(gh release view "$TAG" 2>&1)"; then
            echo "release $TAG exists; nothing to do"; exit 0
          fi
          if ! printf '%s' "$found" | grep -qi "release not found"; then
            echo "::error::could not look up release $TAG: $found"; exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
