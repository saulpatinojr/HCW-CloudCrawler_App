# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem)
# proposes updates. CodeQL and dependency review run from their own workflows (codeql.yml,
# dependency-review.yml) and are not duplicated here; the image scan is image-scan.yml.
name: security
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: "23 6 * * 1" }]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the pull request's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  pip-audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.14" }
      - run: python -m pip install "uv==0.11.32"
      - run: uv sync --frozen --all-packages
      - name: Known vulnerabilities in the runtime lock (the only input the image installs)
        run: uv run pip-audit -r requirements.lock.txt --strict
