# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem)
# proposes updates. Runners: ubuntu-26.04, never ubuntu-latest (program convention). uv is installed with pip at the
# exact version this repository was authored with.
# Jobs: lint (ruff, lockfile export, base image pin versus FROM lines, release version consistency), test (96 percent coverage gate; the azmcp-marked
# contract test excluded),
# contract (the real Azure MCP Server 3.0.0 over stdio through npx: initialize and tools/list only, no Azure call),
# image (build, startup refusal under a secret-bearing variable, non-root, health answers).
name: ci
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_VERSION: "0.13.8"
  PYTHON_VERSION: "3.15"
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        # Also after an earlier failure (checkout is the only step before it), because the lint-tools
        # install below runs then too and makes zizmor's environment with python3.
        if: ${{ !cancelled() }}
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      # The three linters and then the uv check run first, straight after setting up Python: no
      # repository code (uv sync builds this project's packages, ruff and the scripts run) has
      # run yet, so nothing in this pull request can rewrite .github on disk before it is read.
      # Workflow and Dockerfile linters (HCW-HybridCloudWorks#1575): the
      # same three tools, versions and digests as the website's CI. CodeRabbit
      # used to run them and was removed on 2026-11-06. Each tool is a pinned
      # release whose SHA-256 is written here; move a version and its digest
      # together. Each linter runs even when the one before it failed, so one
      # run shows every finding.
      - name: Install actionlint, hadolint and zizmor (pinned, digests checked)
        id: lint-tools
        # Runs after an earlier failure in this job too, so one run reports the
        # linters' findings beside whatever else failed.
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          HADOLINT_VERSION: 2.14.0
          HADOLINT_SHA256: 6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47
          ZIZMOR_VERSION: 1.31.1
          ZIZMOR_SHA256: 58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/lint-tools"
          mkdir -p "$tools"
          cd "$tools"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 --retry-all-errors -o "$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          curl -sSfL --retry 3 --retry-all-errors -o hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod 0755 actionlint hadolint
          # zizmor in its own environment: one wheel, one hash, nothing else.
          python3 -m venv zizmor-env
          echo "zizmor==${ZIZMOR_VERSION} --hash=sha256:${ZIZMOR_SHA256}" > zizmor-requirements.txt
          zizmor-env/bin/python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r zizmor-requirements.txt
          ln -s "$tools/zizmor-env/bin/zizmor" zizmor
          echo "$tools" >> "$GITHUB_PATH"

      - name: actionlint
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: |
          actionlint -version
          actionlint -color

      - name: zizmor
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: |
          zizmor --version
          args=(--offline --format=github)
          if [ -f .github/zizmor.yml ]; then args+=(--config .github/zizmor.yml); fi
          # .github/actions too: the composite action there is handed the App key.
          zizmor "${args[@]}" .github/workflows .github/actions

      - name: hadolint
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: |
          set -euo pipefail
          hadolint --version
          # Written to a file first, so a failing git stops the step (inside
          # `< <(...)` its failure would be lost and read as "none tracked").
          list="${RUNNER_TEMP}/dockerfiles"
          git ls-files -z -- ':(glob)**/Dockerfile' ':(glob)**/Dockerfile.*' ':(glob)**/*.Dockerfile' > "$list"
          mapfile -d '' files < "$list"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no Dockerfile is tracked; nothing to lint"
            exit 0
          fi
          printf 'linting %s\n' "${files[@]}"
          hadolint --failure-threshold warning --format tty "${files[@]}"

      # UV_VERSION is the one uv version (HCW-HybridCloudWorks#1707). scripts/check_uv_pins.py (standard library
      # only, so it runs before uv is installed) needs each workflow named here to install that uv, and fails on any
      # other uv in a workflow or composite action; its docstring lists what it reads, and
      # tests/unit/test_check_uv_pins.py tests it. Runs after an earlier failure too, so one run reports every finding.
      - name: Every workflow uses the uv this workflow uses
        if: ${{ !cancelled() }}
        run: python scripts/check_uv_pins.py .github/workflows/pages.yml .github/workflows/publish-core.yml .github/workflows/security.yml .github/workflows/dependabot-lockfiles.yml
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: requirements.lock.txt matches uv.lock
        run: bash scripts/check-lockfiles.sh
      - name: versions.env and every FROM of the Dockerfile name the same base image digest
        run: bash scripts/check-versions.sh
      - name: Every place that names the release version agrees (a v* tag can never be corrected)
        run: python scripts/check-release-version.py
      - name: No client-secret credential path anywhere in the application
        run: |
          set -euo pipefail
          if grep -rn "ClientSecretCredential\|CertificateCredential\|UsernamePasswordCredential" src packages; then
            echo "::error::a client-secret credential path exists"; exit 1
          fi
          echo "no client-secret credential path"

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --all-packages
      - name: Unit, security and acceptance tests with the 96 percent coverage gate
        run: uv run pytest -q --cov=packages --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=96
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage, path: coverage.xml, if-no-files-found: error }
  contract:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      # Node.js 26, the HCW floor (the newest LTS line). @azure/mcp 3.0.0 accepts Node.js 22 or later (its npm
      # "engines" field), so 22 is the lowest that works, not a requirement (ADR 0001, "Update of 2026-11-12").
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "26", package-manager-cache: false }
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --all-packages
      - name: Azure MCP Server 3.0.0 tools/list matches the committed snapshot (ADR 0001)
        run: uv run pytest tests/contract -q -m azmcp
  image:
    runs-on: ubuntu-26.04
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the appliance image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          load: true
          push: false
          tags: "hcw-cloud-crawler-appliance:dev"
      - name: Startup refusal, non-root and health
        run: |
          set -euo pipefail
          if docker run --rm -e AZURE_CLIENT_SECRET=x hcw-cloud-crawler-appliance:dev; then
            echo "::error::started with a client secret in the environment"; exit 1
          fi
          if docker run --rm hcw-cloud-crawler-appliance:dev python -m pip --version; then
            echo "::error::pip is present in the image"; exit 1
          fi
          test "$(docker run --rm hcw-cloud-crawler-appliance:dev id -u)" = "10001"
          wait_for_health() {
            for _ in $(seq 1 20); do curl -fsS "http://127.0.0.1:$1/api/health" >/dev/null && return 0; sleep 1; done
            return 1
          }
          # The image listens on every interface, so with no sign-in and no opt-out it must refuse to start (ADR 0004).
          if docker run --rm hcw-cloud-crawler-appliance:dev; then
            echo "::error::started unauthenticated on 0.0.0.0 without the opt-out"; exit 1
          fi
          # The lab path: the explicit opt-out is the only way to start the image without sign-in.
          lab=(-e CC_ALLOW_UNAUTHENTICATED_NON_LOOPBACK=true)
          cid="$(docker run -d -p 18080:8080 "${lab[@]}" hcw-cloud-crawler-appliance:dev)"
          wait_for_health 18080
          curl -fsS http://127.0.0.1:18080/api/health | grep -q '"edition":"appliance"'
          docker rm -f "$cid"
          # Sign-in on needs no opt-out; with placeholder ids (no network is used) a request without a token is refused.
          entra=(-e CC_AUTH_MODE=entra -e CC_ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000002)
          entra+=(-e CC_ENTRA_AUDIENCE=api://00000000-0000-0000-0000-000000000003)
          cid="$(docker run -d -p 18081:8080 "${entra[@]}" hcw-cloud-crawler-appliance:dev)"
          wait_for_health 18081
          curl -fsS http://127.0.0.1:18081/api/health | grep -q '"auth":"entra"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/api/nope)" = "401"
          docker rm -f "$cid"
