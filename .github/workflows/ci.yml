# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem)
# proposes updates. Runners: ubuntu-26.04, never ubuntu-latest (program convention). uv is installed with pip at the
# exact version this repository was authored with.
# Jobs: lint (ruff, lockfile export), test (85 percent coverage gate; the azmcp-marked contract test excluded),
# contract (the real Azure MCP Server 3.0.0 over stdio through npx: initialize and tools/list only, no Azure call),
# image (build, startup refusal under a secret-bearing variable, non-root, health answers).
name: ci
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.14"
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: bash scripts/check-lockfiles.sh
      - name: No client-secret credential path anywhere in the application
        run: |
          set -euo pipefail
          if grep -rn "ClientSecretCredential\|CertificateCredential\|UsernamePasswordCredential" src packages; then echo "::error::a client-secret credential path exists"; exit 1; fi
          echo "no client-secret credential path"
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen --all-packages
      - name: Unit, security and acceptance tests with the 85 percent coverage gate
        run: uv run pytest -q --cov=packages --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage, path: coverage.xml, if-no-files-found: error }
  contract:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "22" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen --all-packages
      - name: Azure MCP Server 3.0.0 tools/list matches the committed snapshot (ADR 0001)
        run: uv run pytest tests/contract -q -m azmcp
  image:
    runs-on: ubuntu-26.04
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the appliance image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ., file: infrastructure/docker/Dockerfile, load: true, push: false, tags: "hcw-cloud-crawler-appliance:dev" }
      - name: Startup refusal, non-root and health
        run: |
          set -euo pipefail
          if docker run --rm -e AZURE_CLIENT_SECRET=x hcw-cloud-crawler-appliance:dev; then echo "::error::started with a client secret in the environment"; exit 1; fi
          if docker run --rm hcw-cloud-crawler-appliance:dev python -m pip --version; then echo "::error::pip is present in the image"; exit 1; fi
          test "$(docker run --rm hcw-cloud-crawler-appliance:dev id -u)" = "10001"
          cid="$(docker run -d -p 18080:8080 hcw-cloud-crawler-appliance:dev)"
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/api/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:18080/api/health | grep -q '"edition":"appliance"'
          docker rm -f "$cid"
