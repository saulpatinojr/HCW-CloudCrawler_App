name: Work item (maintainers)
description: A tracked piece of engineering, documentation, security or release work with acceptance criteria.
title: "[Work]: "
labels:
  - product:cloudcrawler
body:
  - type: markdown
    attributes:
      value: |
        For planned work with a clear outcome. Write for someone with no memory of earlier sessions: say what a thing is
        the first time it appears. Mark each statement under Evidence as VERIFIED (you saw it) or ASSUMED (you did not).
        Do not paste secrets, customer data or real tenant or subscription identifiers.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What is wrong or missing, and why it matters.
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Repository and affected path or component
      placeholder: "saulpatinojr/HCW-CloudCrawler_App, .github/workflows/security.yml"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: "VERIFIED / ASSUMED statements, each with the command, file and line, or link that shows it."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes that make this done. One per line.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation steps
      description: Numbered steps, naming the shell (bash or PowerShell) and the result to expect.
    validations:
      required: true

  - type: textarea
    id: blockers
    attributes:
      label: Dependencies or blockers
      description: Owner decisions, approvals or access this needs. Say "None" if there are none.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P1 High
        - P2 Medium
        - P3 Low
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - CI
        - Dependencies
        - Documentation
        - Governance
        - Release
        - Security
        - Testing
    validations:
      required: true

  - type: dropdown
    id: validation_environment
    attributes:
      label: Validation environment
      options:
        - Local
        - CI
        - Not applicable
    validations:
      required: true
