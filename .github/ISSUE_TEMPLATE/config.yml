# GitHub reads this file from .github/ISSUE_TEMPLATE/config.yml.

# Structured forms are the default. Set this to true only when maintainers
# intentionally accept unstructured issue reports.
blank_issues_enabled: false
contact_links:
  - name: Security reports
    url: https://github.com/saulpatinojr/HCW-CloudCrawler_App/blob/main/.github/SECURITY.md
    about: Report a vulnerability privately as the security policy describes, never in a public issue.
  - name: Questions about Cloud Crawler and the website
    url: https://hybridcloudworks.com
    about: Repository Discussions are not enabled; questions that are not actionable issues go through the website.
