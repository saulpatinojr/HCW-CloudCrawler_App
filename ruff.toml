# Lint and format settings for both packages, the scripts and the tests.
target-version = "py314"
line-length = 120
extend-exclude = [".venv", "samples", "infrastructure", "*.md"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["B008"]  # FastAPI dependency defaults in signatures

[lint.per-file-ignores]
"tests/**" = ["S101"]
"packages/cloud-crawler-core/tests/**" = ["S101"]

[format]
quote-style = "double"
